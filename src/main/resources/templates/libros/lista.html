<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libros - PUCE librería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
</head>
<body class="bg-gray-50">

<div th:replace="~{fragmentos/nav :: nav}"></div>

<main class="max-w-screen-xl mx-auto p-4">
    <div class="flex items-center justify-between my-6">
        <h1 class="text-2xl font-semibold text-gray-900">Libros</h1>
        <a th:href="@{/libros/formulario}"
           class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-5 py-2.5">Nuevo libro</a>
    </div>

    <div class="flex flex-wrap items-center gap-x-8 gap-y-3 mb-4">
        <form th:action="@{/libros/buscar}" method="get" class="flex items-center gap-2">
            <label for="id" class="text-sm font-medium text-gray-900">Buscar por id:</label>
            <input type="number" id="id" name="id" min="1" required th:value="${idBuscado}"
                   class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 w-32">
            <button type="submit"
                    class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2">Buscar</button>
        </form>

        <form th:action="@{/libros/buscar-titulo}" method="get" class="flex items-center gap-2">
            <label for="titulo" class="text-sm font-medium text-gray-900">Buscar por título:</label>
            <input type="text" id="titulo" name="titulo" required th:value="${tituloBuscado}"
                   placeholder="Ej: quijote"
                   class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2 w-56">
            <button type="submit"
                    class="text-white bg-blue-700 hover:bg-blue-800 font-medium rounded-lg text-sm px-4 py-2">Buscar</button>
        </form>

        <a th:if="${idBuscado != null or tituloBuscado != null}" th:href="@{/libros}"
           class="text-sm text-blue-700 hover:underline">Ver todos</a>
    </div>

    <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
        <table class="w-full text-sm text-left text-gray-500">
            <thead class="text-xs text-gray-700 uppercase bg-gray-100">
            <tr>
                <th scope="col" class="px-6 py-3">ID</th>
                <th scope="col" class="px-6 py-3">Título</th>
                <th scope="col" class="px-6 py-3">Editorial</th>
                <th scope="col" class="px-6 py-3">Género</th>
                <th scope="col" class="px-6 py-3"># páginas</th>
                <th scope="col" class="px-6 py-3">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="libro : ${libros}" class="bg-white border-b border-gray-200">
                <td class="px-6 py-4" th:text="${libro.id}"></td>
                <td class="px-6 py-4 font-medium text-gray-900" th:text="${libro.titulo}"></td>
                <td class="px-6 py-4" th:text="${libro.editorial}"></td>
                <td class="px-6 py-4" th:text="${libro.genero}"></td>
                <td class="px-6 py-4" th:text="${libro.paginas}"></td>
                <td class="px-6 py-4">
                    <div class="flex items-center gap-4">
                        <a th:href="@{/libros/editar/{id}(id=${libro.id})}"
                           class="font-medium text-blue-700 hover:underline">Editar</a>
                        <form th:action="@{/libros/eliminar/{id}(id=${libro.id})}" method="post"
                              onsubmit="return confirm('¿Eliminar este libro?');">
                            <button type="submit" class="font-medium text-red-600 hover:underline">Eliminar</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(libros)}" class="bg-white">
                <td colspan="6" class="px-6 py-4 text-center">
                    <span th:if="${idBuscado != null}" th:text="'No existe un libro con id ' + ${idBuscado}"></span>
                    <span th:if="${tituloBuscado != null}" th:text="'No existe un libro con el título: ' + ${tituloBuscado}"></span>
                    <span th:if="${idBuscado == null and tituloBuscado == null}">No hay libros registrados.</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
