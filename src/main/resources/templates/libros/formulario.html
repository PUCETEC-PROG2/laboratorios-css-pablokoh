<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Libros - PUCE librería</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.5.2/dist/flowbite.min.js"></script>
</head>
<body class="bg-gray-50">

<div th:replace="~{fragmentos/nav :: nav}"></div>

<main class="max-w-md mx-auto p-4">
    <h1 class="text-2xl font-semibold text-center text-gray-900 my-6"
        th:text="${libro.id == null} ? 'Registro de Libros' : 'Editar libro #' + ${libro.id}">Registro de Libros</h1>

    <!-- Si el libro no tiene id es nuevo (INSERT); si tiene id se actualiza (UPDATE ... WHERE id = ?) -->
    <form th:action="${libro.id == null} ? @{/libros/guardar} : @{/libros/actualizar/{id}(id=${libro.id})}"
          th:object="${libro}" method="post" class="space-y-5">
        <div>
            <label for="titulo" class="block mb-2 text-sm font-medium text-gray-900">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}" required
                   class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
        <div>
            <label for="editorial" class="block mb-2 text-sm font-medium text-gray-900">Editorial</label>
            <input type="text" id="editorial" th:field="*{editorial}" required
                   class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
        <div>
            <label for="genero" class="block mb-2 text-sm font-medium text-gray-900">Género</label>
            <input type="text" id="genero" th:field="*{genero}" required
                   class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
        <div>
            <label for="paginas" class="block mb-2 text-sm font-medium text-gray-900"># páginas</label>
            <input type="number" id="paginas" th:field="*{paginas}" min="1" required
                   class="bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5">
        </div>
        <button type="submit"
                class="w-full text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:outline-none focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center">
            <span th:text="${libro.id == null} ? 'Guardar' : 'Actualizar'">Guardar</span>
        </button>
        <a th:if="${libro.id != null}" th:href="@{/libros}"
           class="block text-center text-sm text-blue-700 hover:underline">Cancelar</a>
    </form>
</main>

</body>
</html>
