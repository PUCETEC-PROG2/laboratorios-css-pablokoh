spring.application.name=PUCE librer\u00eda

# Conexión a PostgreSQL (cambia usuario/contraseña si en tu PC son otros)
spring.datasource.url=jdbc:postgresql://localhost:5432/puce_libreria
spring.datasource.username=postgres
spring.datasource.password=postgres

# Si existe config-local.properties (junto a pom.xml), sus valores reemplazan a los de arriba.
# Ahí va la contraseña real de cada PC; ese archivo NO se sube a GitHub (.gitignore).
spring.config.import=optional:file:./config-local.properties

# Crea/actualiza las tablas automáticamente a partir de las entidades (Libro.java)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
